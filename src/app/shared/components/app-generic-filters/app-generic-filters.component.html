<div class="generic-filters-card card border-0 shadow-sm mb-4">
  <div class="card-body p-3 p-md-4">
    @if (title) {
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h6 class="filters-header-title mb-0 fw-bold text-dark">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2 text-primary">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
          {{ title }}
        </h6>
        @if (hasActiveFilters()) {
          <button type="button" class="btn btn-sm btn-link text-danger text-decoration-none p-0 fw-semibold" (click)="resetFilters()">
            Limpiar filtros
          </button>
        }
      </div>
    }

    <div class="row g-3">
      @for (field of config; track field.key) {
        <div [class]="field.columnClass || 'col-12 col-sm-6 col-lg-3'">
          <label class="form-label small text-secondary fw-semibold mb-1">{{ field.label }}</label>

          @if (field.type === 'text') {
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-light border-end-0 text-muted">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </span>
              <input
                type="text"
                class="form-control form-control-sm border-start-0 ps-0"
                [placeholder]="field.placeholder || 'Buscar...'"
                [value]="values[field.key] || ''"
                (input)="onInputChange(field.key, $event)"
              />
            </div>
          }

          @if (field.type === 'select') {
            <select
              class="form-select form-select-sm"
              [value]="values[field.key] || ''"
              (change)="onSelectChange(field.key, $event)"
            >
              @for (opt of field.options; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
          }

          @if (field.type === 'numberRange') {
            <div class="d-flex gap-2">
              <input
                type="number"
                class="form-control form-control-sm"
                placeholder="Mín"
                [value]="values[field.key + '_min'] || ''"
                (input)="onInputChange(field.key + '_min', $event)"
              />
              <input
                type="number"
                class="form-control form-control-sm"
                placeholder="Máx"
                [value]="values[field.key + '_max'] || ''"
                (input)="onInputChange(field.key + '_max', $event)"
              />
            </div>
          }

          @if (field.type === 'dateRange') {
            <div class="d-flex gap-2">
              <input
                type="date"
                class="form-control form-control-sm"
                [value]="values[field.key + '_from'] || ''"
                (input)="onInputChange(field.key + '_from', $event)"
              />
              <input
                type="date"
                class="form-control form-control-sm"
                [value]="values[field.key + '_to'] || ''"
                (input)="onInputChange(field.key + '_to', $event)"
              />
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
