<div class="card border-0 shadow-sm rounded-3 p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-dark mb-0">Búsqueda y Reimpresión de Comprobantes</h4>
    <a [routerLink]="['/pos']" class="btn btn-outline-secondary btn-sm">Volver a Venta</a>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <input type="text" class="form-control" placeholder="Buscar por NCF, Cliente o ID..." />
    </div>
    <div class="col-md-3">
      <button class="btn btn-primary w-100" type="button">Buscar</button>
    </div>
  </div>

  <div class="text-center py-4 text-secondary small">
    Ingrese un criterio de búsqueda para localizar comprobantes fiscales o tickets emitidos.
  </div>
</div>
