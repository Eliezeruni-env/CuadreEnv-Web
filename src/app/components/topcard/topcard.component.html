<div class="card h-100 border-0 shadow-sm topcard-item" [ngClass]="'border-start-' + (variant || 'primary')">
  <div class="card-body p-3 d-flex align-items-center justify-content-between">
    <div>
      <span class="text-secondary small fw-semibold text-uppercase font-size-xs d-block mb-1">
        {{ title }}
      </span>
      <h3 class="fw-bold mb-0 text-dark">{{ value }}</h3>
      @if (subtitle) {
        <small class="text-muted d-block mt-1">{{ subtitle }}</small>
      }
    </div>
    <div class="topcard-icon-box rounded-circle d-flex align-items-center justify-content-center" [ngClass]="'bg-' + (variant || 'primary') + '-subtle text-' + (variant || 'primary')">
      <svg cIcon [name]="icon || 'cilChart'" style="width: 22px; height: 22px;"></svg>
    </div>
  </div>
</div>
