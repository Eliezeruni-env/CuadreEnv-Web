<div class="container-fluid py-3">
  <!-- Header Toolbar -->
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div>
      <h3 class="fw-bold text-dark mb-1">Nueva Transferencia entre Almacenes</h3>
      <p class="text-secondary small mb-0">Reubicación atómica de inventario desde sucursal origen hacia sucursal destino</p>
    </div>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-light border" (click)="cancel()">
        Cancelar
      </button>
      <button
        type="button"
        class="btn btn-primary fw-semibold d-flex align-items-center gap-2 shadow-sm"
        [disabled]="isSaving() || productDetails.length === 0"
        (click)="saveTransfer()"
      >
        @if (isSaving()) {
          <span class="spinner-border spinner-border-sm"></span>
          Transfiriendo...
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          Ejecutar Transferencia
        }
      </button>
    </div>
  </div>

  <!-- Reusable General Data Header Form (Transfer Mode) -->
  <app-inventory-general-data
    mode="transfer"
    [header]="header"
    (headerChange)="onHeaderChange($event)"
  ></app-inventory-general-data>

  <!-- Reusable Product Search & Add Component (Validates origin stock) -->
  <app-product-search
    mode="transfer"
    [warehouseId]="header.warehouseOfOriginId || 1"
    [detailToEdit]="detailToEdit"
    (productAdded)="onProductAdded($event)"
    (productUpdated)="onProductUpdated($event)"
  ></app-product-search>

  <!-- Reusable Product Movement Table Component -->
  <app-product-table
    mode="transfer"
    [items]="productDetails"
    (editIndex)="onEditIndex($event)"
    (deleteIndex)="onDeleteIndex($event)"
  ></app-product-table>
</div>
